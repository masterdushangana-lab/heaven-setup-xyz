name: Abyss Direct Video Deletion Worker

on:
  workflow_dispatch:
    inputs:
      file_id:
        description: 'Abyss File ID (Slug) to permanently delete'
        required: true
        type: string

jobs:
  delete_abyss:
    name: Delete Video on Abyss.to
    runs-on: ubuntu-latest
    steps:
      - name: Obtain Abyss Bearer Token & Delete Video
        env:
          ABYSS_API_KEY: ${{ secrets.ABYSS_API_KEY }}
          ABYSS_EMAIL: ${{ secrets.ABYSS_EMAIL }}
          ABYSS_PASSWORD: ${{ secrets.ABYSS_PASSWORD }}
          FILE_ID: ${{ inputs.file_id }}
        run: |
          echo "[*] Deleting file from Abyss: $FILE_ID"
          CLEAN_KEY=$(echo -n "$ABYSS_API_KEY" | tr -d '\r\n[:space:]')
          BEARER_TOKEN=""

          # Step 1: If email and password are provided, login to get fresh JWT token
          if [ -n "$ABYSS_EMAIL" ] && [ -n "$ABYSS_PASSWORD" ]; then
            echo "[*] Logging into Abyss (/auth/login) with credentials..."
            LOGIN_RESP=$(curl -s -X POST "https://api.abyss.to/auth/login" \
              -H "Content-Type: application/json" \
              -H "User-Agent: curl/8.5.0" \
              -d "{\"email\":\"$ABYSS_EMAIL\",\"password\":\"$ABYSS_PASSWORD\"}")

            BEARER_TOKEN=$(echo "$LOGIN_RESP" | jq -r '.token // empty')
            if [ -n "$BEARER_TOKEN" ]; then
              echo "[SUCCESS] Authenticated with Abyss! JWT Bearer token obtained."
            else
              echo "[WARN] Login did not return token: $LOGIN_RESP"
            fi
          fi

          # Step 2: Fallback to ABYSS_API_KEY if no login token
          if [ -z "$BEARER_TOKEN" ]; then
            BEARER_TOKEN="$CLEAN_KEY"
          fi

          if [ -z "$BEARER_TOKEN" ]; then
            echo "[ERROR] No valid Bearer Token or ABYSS_EMAIL/PASSWORD available!"
            exit 1
          fi

          # Step 3: Call Official DELETE /v1/files/:id
          echo "[*] Sending DELETE /v1/files/$FILE_ID with Bearer Token..."
          HTTP_STATUS=$(curl -s -o resp.txt -w "%{http_code}" -X DELETE "https://api.abyss.to/v1/files/$FILE_ID" \
            -H "Authorization: Bearer $BEARER_TOKEN" \
            -H "User-Agent: curl/8.5.0" \
            -H "Accept: application/json")

          echo "Abyss DELETE Response (HTTP $HTTP_STATUS):"
          cat resp.txt
          echo ""

          if [ "$HTTP_STATUS" -ge 200 ] && [ "$HTTP_STATUS" -lt 300 ]; then
            echo "[SUCCESS] File $FILE_ID successfully deleted from Abyss.to!"
          elif [ "$HTTP_STATUS" -eq 404 ]; then
            echo "[INFO] File $FILE_ID does not exist on Abyss (already deleted)."
          else
            echo "[ERROR] Abyss deletion failed with HTTP status $HTTP_STATUS"
            exit 1
          fi
