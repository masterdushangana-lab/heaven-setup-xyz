name: Purge Old Workflow Runs & Clean Logs

on:
  schedule:
    # Automatically clean old runs every midnight (00:00 UTC)
    - cron: '0 0 * * *'
  workflow_dispatch:
    inputs:
      retain_days:
        description: 'Keep runs from the last N days (0 deletes all finished runs)'
        required: false
        default: '1'
        type: string
      keep_minimum:
        description: 'Minimum number of recent runs to keep'
        required: false
        default: '5'
        type: string

permissions:
  actions: write
  contents: read

jobs:
  cleanup:
    name: Auto Purge Action Runs
    runs-on: ubuntu-latest
    steps:
      - name: Delete Old Runs and Logs
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GITHUB_REPOSITORY: ${{ github.repository }}
          RETAIN_DAYS: ${{ inputs.retain_days || '1' }}
          KEEP_MIN: ${{ inputs.keep_minimum || '5' }}
        run: |
          python3 -c "
          import urllib.request
          import json
          import os
          import time
          from datetime import datetime, timezone, timedelta

          repo = os.environ.get('GITHUB_REPOSITORY', 'masterdushangana-lab/heaven-setup-xyz')
          token = os.environ.get('GH_TOKEN')
          retain_days = float(os.environ.get('RETAIN_DAYS', '1'))
          keep_min = int(os.environ.get('KEEP_MIN', '5'))

          headers = {
              'Authorization': f'Bearer {token}',
              'Accept': 'application/vnd.github+json',
              'User-Agent': 'Actions-Purge-Engine'
          }

          cutoff = datetime.now(timezone.utc) - timedelta(days=retain_days)
          print(f'[*] Purging workflow runs older than {retain_days} days (Cutoff: {cutoff.isoformat()})...')

          deleted_count = 0
          for page in range(1, 10):
              url = f'https://api.github.com/repos/{repo}/actions/runs?per_page=100&page={page}'
              req = urllib.request.Request(url, headers=headers)
              try:
                  with urllib.request.urlopen(req, timeout=20) as resp:
                      data = json.loads(resp.read().decode('utf-8'))
                      runs = data.get('workflow_runs', [])
                      if not runs:
                          break

                      # Keep the newest keep_min runs overall
                      if page == 1 and len(runs) > keep_min:
                          eligible = runs[keep_min:]
                      elif page > 1:
                          eligible = runs
                      else:
                          eligible = []

                      for r in eligible:
                          rid = r['id']
                          status = r.get('status')
                          conclusion = r.get('conclusion')
                          created_at_str = r.get('created_at')

                          # Only delete completed runs (success, failure, cancelled, skipped)
                          if status == 'completed':
                              dt = datetime.fromisoformat(created_at_str.replace('Z', '+00:00'))
                              if dt < cutoff or retain_days == 0:
                                  del_url = f'https://api.github.com/repos/{repo}/actions/runs/{rid}'
                                  d_req = urllib.request.Request(del_url, headers=headers, method='DELETE')
                                  try:
                                      with urllib.request.urlopen(d_req, timeout=10) as d_resp:
                                          if d_resp.status in (204, 200):
                                              deleted_count += 1
                                              print(f'  [-] Deleted old run {rid} ({r.get(\"name\")}) from {created_at_str}')
                                  except Exception as e_del:
                                      print(f'  [!] Failed to delete run {rid}: {e_del}')
                                  time.sleep(0.1)
              except Exception as e_page:
                  print(f'[!] Error fetching page {page}: {e_page}')
                  break

          print(f'[SUCCESS] Cleaned up {deleted_count} old workflow runs & logs successfully!')
          "
