name: Purge Old Workflow Runs & Clean Logs

on:
  schedule:
    # Automatically clean old completed runs every 10 minutes continuously
    - cron: '*/10 * * * *'
  workflow_dispatch:
    inputs:
      retain_minutes:
        description: 'Keep finished runs from the last N minutes (0 deletes all finished runs)'
        required: false
        default: '0'
        type: string
      keep_minimum:
        description: 'Minimum number of recent runs to keep (0 deletes all completed)'
        required: false
        default: '0'
        type: string

concurrency:
  group: purge-old-runs-pipeline
  cancel-in-progress: false

permissions:
  actions: write
  contents: read

jobs:
  cleanup:
    name: Auto Purge Action Runs
    runs-on: ubuntu-latest
    steps:
      - name: Delete Old Runs and Logs
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GITHUB_REPOSITORY: ${{ github.repository }}
          RETAIN_MINUTES: ${{ inputs.retain_minutes || '0' }}
          KEEP_MIN: ${{ inputs.keep_minimum || '0' }}
        run: |
          python3 -c "
          import urllib.request
          import json
          import os
          import time
          from datetime import datetime, timezone, timedelta

          repo = os.environ.get('GITHUB_REPOSITORY', 'masterdushangana-lab/heaven-setup-xyz')
          token = os.environ.get('GH_TOKEN')
          retain_minutes = float(os.environ.get('RETAIN_MINUTES', '0'))
          keep_min = int(os.environ.get('KEEP_MIN', '0'))

          headers = {
              'Authorization': f'Bearer {token}',
              'Accept': 'application/vnd.github+json',
              'User-Agent': 'Actions-Purge-Engine'
          }

          cutoff = datetime.now(timezone.utc) - timedelta(minutes=retain_minutes)
          print(f'[*] Purging finished workflow runs (retain_minutes={retain_minutes}, keep_min={keep_min})...')

          deleted_count = 0
          for page in range(1, 15):
              url = f'https://api.github.com/repos/{repo}/actions/runs?per_page=100&page={page}'
              req = urllib.request.Request(url, headers=headers)
              try:
                  with urllib.request.urlopen(req, timeout=20) as resp:
                      data = json.loads(resp.read().decode('utf-8'))
                      runs = data.get('workflow_runs', [])
                      if not runs:
                          break

                      if keep_min > 0:
                          if page == 1 and len(runs) > keep_min:
                              eligible = runs[keep_min:]
                          elif page > 1:
                              eligible = runs
                          else:
                              eligible = []
                      else:
                          eligible = runs

                      for r in eligible:
                          rid = r['id']
                          status = r.get('status')
                          created_at_str = r.get('created_at')

                          # Only delete completed runs (success, failure, cancelled, skipped)
                          # Never touch in_progress or queued runs
                          if status == 'completed':
                              dt = datetime.fromisoformat(created_at_str.replace('Z', '+00:00'))
                              if dt < cutoff or retain_minutes == 0:
                                  del_url = f'https://api.github.com/repos/{repo}/actions/runs/{rid}'
                                  d_req = urllib.request.Request(del_url, headers=headers, method='DELETE')
                                  try:
                                      with urllib.request.urlopen(d_req, timeout=10) as d_resp:
                                          if d_resp.status in (204, 200):
                                              deleted_count += 1
                                              print(f'  [-] Deleted completed run {rid} ({r.get(\"name\")})')
                                  except Exception as e_del:
                                      print(f'  [!] Failed to delete run {rid}: {e_del}')
                                  time.sleep(0.08)
              except Exception as e_page:
                  print(f'[!] Error fetching page {page}: {e_page}')
                  break

          print(f'[SUCCESS] Cleaned up {deleted_count} completed workflow runs & logs successfully!')
          "
