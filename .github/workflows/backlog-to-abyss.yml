name: Sync Telegram Backlog to Abyss (AnimeHeaven + MegaPlay Fallback)

on:
  workflow_dispatch:
    inputs:
      migrate_limit:
        description: 'Limit number of episodes per run (0 for all)'
        required: false
        default: '0'

concurrency:
  group: backlog-to-abyss-sync
  cancel-in-progress: false

jobs:
  sync_backlog:
    name: Sync Source Videos -> Abyss
    runs-on: ubuntu-latest
    timeout-minutes: 360

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.10'

      - name: Install System Dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y curl ffmpeg
          pip install cryptography curl_cffi

      - name: Run Backlog Sync to Abyss
        env:
          PYTHONUNBUFFERED: "1"
          MAPPING_PASSWORD: ${{ secrets.MAPPING_PASSWORD }}
          ABYSS_API_KEYS: ${{ secrets.ABYSS_API_KEYS || secrets.ABYSS_API_KEY || secrets.MP4UPLOAD_API_KEY }}
          ABYSS_API_KEY: ${{ secrets.ABYSS_API_KEYS || secrets.ABYSS_API_KEY || secrets.MP4UPLOAD_API_KEY }}
          MIGRATE_LIMIT: ${{ inputs.migrate_limit || '0' }}
        run: |
          python backlog_sync_to_abyss.py

      - name: Commit & Push Updated History
        run: |
          git config --local user.email "action@github.com"
          git config --local user.name "GitHub Action [Backlog-Abyss Sync]"
          git add uploaded_episodes.json
          git diff-index --quiet HEAD || git commit -m "Auto-Synced Backlog videos to Abyss.to [skip ci]"
          git pull --rebase origin main || true
          git push origin main || echo "No changes or push failed"
