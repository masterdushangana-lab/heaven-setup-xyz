name: AnimeHeaven Ingestion & Abyss Upload (MAL Indexed)

on:
  schedule:
    # Runs every 15 minutes automatically for fresh releases
    - cron: '*/15 * * * *'
  workflow_dispatch:
    inputs:
      target_anime_url:
        description: 'Anime URL (e.g. https://animeheaven.me/anime.php?5u8d5). Leave blank for fresh auto releases.'
        required: false
        default: ''
        type: string
      episode_range:
        description: 'Episode Range filter (e.g. 1-12, 13-24, 5, or 1-5,10-15). Leave blank or "all" to upload all available.'
        required: false
        default: 'all'
        type: string

concurrency:
  group: animeheaven-pipeline
  cancel-in-progress: false

jobs:
  detect:
    name: Detect Episodes & MAL Lookup
    runs-on: ubuntu-latest
    outputs:
      has_items: ${{ steps.detect_step.outputs.has_items }}
      matrix: ${{ steps.detect_step.outputs.matrix }}
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Detect episodes
        id: detect_step
        env:
          TARGET_ANIME_URL: ${{ inputs.target_anime_url }}
          EPISODE_RANGE: ${{ inputs.episode_range }}
          MAL_CLIENT_ID: ${{ secrets.MAL_CLIENT_ID }}
        run: |
          python detect_episodes.py

  upload:
    name: Upload EP
    needs: detect
    if: needs.detect.outputs.has_items == 'true'
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      max-parallel: 18
      matrix:
        item: ${{ fromJson(needs.detect.outputs.matrix) }}
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Upload Episode
        env:
          ABYSS_API_KEY: ${{ secrets.ABYSS_API_KEY }}
          ITEM_META_B64: ${{ matrix.item.meta_b64 }}
        run: |
          python upload_single.py

      - name: Save Result Artifact
        uses: actions/upload-artifact@v4
        with:
          name: result-${{ matrix.item.key }}
          path: artifacts/
          retention-days: 1

  sync:
    name: Sync MAL Tree History & Commit
    needs: upload
    if: always()
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Download Artifacts
        uses: actions/download-artifact@v4
        with:
          path: downloaded_artifacts
        continue-on-error: true

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Sync history
        run: |
          python sync_history.py downloaded_artifacts

      - name: Commit & Push History
        run: |
          git config --global user.name "github-actions[bot]"
          git config --global user.email "github-actions[bot]@users.noreply.github.com"
          git add uploaded_episodes.json
          git diff --quiet && git diff --staged --quiet || (git commit -m "Auto: Synced MAL indexed uploaded episodes" && git push)
