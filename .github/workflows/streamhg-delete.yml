name: Delete Video on StreamHG

on:
  workflow_dispatch:
    inputs:
      file_id:
        description: 'StreamHG file_code to delete'
        required: true
        type: string

jobs:
  delete_streamhg:
    name: Delete Video from StreamHG
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install cryptography
        run: pip install cryptography

      - name: Execute StreamHG Delete
        env:
          STREAMHG_API_KEY: ${{ secrets.STREAMHG_API_KEY || secrets.ABYSS_API_KEY }}
          FILE_ID: ${{ inputs.file_id }}
        run: |
          python delete_streamhg.py "$FILE_ID"
