name: Migrate Telegram to Abyss (One-By-One)

on:
  workflow_dispatch:

concurrency:
  group: telegram-to-abyss-migrate
  cancel-in-progress: false

permissions:
  contents: write
  actions: write

jobs:
  migrate:
    name: Telegram -> Abyss Migration
    runs-on: ubuntu-latest
    timeout-minutes: 360

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.10'

      - name: Install System Dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y curl ffmpeg
          pip install cryptography

      - name: Start Local Telegram Bot API Server (2GB - 4GB File Support)
        env:
          TG_API_ID: ${{ secrets.TELEGRAM_API_ID || secrets.TG_API_ID }}
          TG_API_HASH: ${{ secrets.TELEGRAM_API_HASH || secrets.TG_API_HASH }}
        run: |
          if [ -n "$TG_API_ID" ] && [ -n "$TG_API_HASH" ]; then
            echo "[*] Launching Local Telegram Bot API server container..."
            mkdir -p /tmp/tg-bot-api-data
            docker run -d \
              --name tg-local-api \
              -p 8081:8081 \
              -v /tmp/tg-bot-api-data:/var/lib/telegram-bot-api \
              -e TELEGRAM_API_ID="${TG_API_ID}" \
              -e TELEGRAM_API_HASH="${TG_API_HASH}" \
              aiogram/telegram-bot-api:latest \
              --local --dir=/var/lib/telegram-bot-api --temp-dir=/tmp
            
            for i in {1..30}; do
              if curl -s http://127.0.0.1:8081 >/dev/null 2>&1; then
                echo "[SUCCESS] Local Telegram Bot API Server is running on port 8081!"
                break
              fi
              sleep 1
            done
          else
            echo "[WARN] TELEGRAM_API_ID or TELEGRAM_API_HASH not found in Secrets. Local bot API skipped."
          fi

      - name: Run Telegram to Abyss Migration
        id: run_migration
        env:
          PYTHONUNBUFFERED: "1"
          MAPPING_PASSWORD: ${{ secrets.MAPPING_PASSWORD }}
          ABYSS_API_KEYS: ${{ secrets.ABYSS_API_KEYS || secrets.ABYSS_API_KEY || secrets.MP4UPLOAD_API_KEY }}
          ABYSS_API_KEY: ${{ secrets.ABYSS_API_KEYS || secrets.ABYSS_API_KEY || secrets.MP4UPLOAD_API_KEY }}
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN || secrets.TG_BOT_TOKEN }}
          TG_LOCAL_API_URL: "http://127.0.0.1:8081"
          MAX_RUN_SECONDS: "18000"
        run: |
          python telegram_to_abyss.py

      - name: Stop Local Telegram Bot API Server
        if: always()
        run: |
          docker rm -f tg-local-api 2>/dev/null || true

      - name: Commit & Push Updated History
        run: |
          git config --local user.email "action@github.com"
          git config --local user.name "GitHub Action [Telegram-Abyss Migration]"
          git add uploaded_episodes.json
          git diff-index --quiet HEAD || git commit -m "Auto-Migrated Telegram videos to Abyss.to [skip ci]"
          git pull --rebase origin main || true
          git push origin main || echo "No changes or push failed"

      - name: Auto-Retrigger Next Batch (Chain Continuation)
        if: steps.run_migration.outputs.has_remaining == 'true'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          echo "[*] Remaining episodes detected! Automatically triggering next run to continue migration seamlessly..."
          gh workflow run "telegram-to-abyss.yml" --ref main || echo "[!] Retrigger via gh cli failed, will rely on next manual trigger"
