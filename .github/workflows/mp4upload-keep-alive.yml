name: Mp4Upload Inactivity Protection & Keep-Alive

on:
  schedule:
    - cron: '0 4 */20 * *' # Automatically runs every 20 days at 04:00 UTC (Resets 6-month timer)
  workflow_dispatch: # Allows manual trigger anytime from GitHub UI or Portal

concurrency:
  group: mp4upload-keepalive
  cancel-in-progress: true

jobs:
  keepalive:
    name: Ping All Mp4Upload Videos
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install cryptography
        run: pip install cryptography

      - name: Run Keep-Alive Ping Bot
        env:
          MAPPING_PASSWORD: ${{ secrets.MAPPING_PASSWORD }}
          MP4UPLOAD_API_KEY: ${{ secrets.MP4UPLOAD_API_KEY || secrets.STREAMHG_API_KEY }}
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN || secrets.TG_BOT_TOKEN }}
          TELEGRAM_ADMIN_CHAT_ID: ${{ secrets.TELEGRAM_ADMIN_CHAT_ID || secrets.ADMIN_CHAT_ID }}
        run: |
          python keep_alive_mp4upload.py
