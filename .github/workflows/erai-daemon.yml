name: Erai-raws Real-Time Autonomous Sentinel (10s Live Trigger)

on:
  schedule:
    # Auto-renews every 5 hours (runs continuously 24/7)
    - cron: '0 */5 * * *'
  workflow_dispatch:
    inputs:
      poll_interval:
        description: 'Polling Interval in seconds (default: 10)'
        required: false
        default: '10'
        type: string
      max_runtime_hours:
        description: 'Maximum runtime per session in hours (default: 5)'
        required: false
        default: '5'
        type: string

concurrency:
  group: erai-realtime-autonomous-sentinel
  cancel-in-progress: true

permissions:
  actions: write
  contents: write

jobs:
  sentinel:
    name: Erai-raws 24/7 Real-Time Sentinel
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install dependencies
        run: pip install cryptography requests

      - name: Run Sentinel Watch Loop
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          MAPPING_PASSWORD: ${{ secrets.MAPPING_PASSWORD }}
          MAL_CLIENT_ID: ${{ secrets.MAL_CLIENT_ID }}
          POLL_INTERVAL: ${{ inputs.poll_interval || '10' }}
          MAX_RUNTIME_HOURS: ${{ inputs.max_runtime_hours || '5' }}
        run: |
          python erai_daemon.py
